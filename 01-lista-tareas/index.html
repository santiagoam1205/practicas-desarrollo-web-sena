<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>

</head>
<body>
    <header>
        <h1>Lista de Tareas</h1>
        <p>Organiza las actividades y puedes controlar tu progreso</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Mis tareas</h2>

            <form id="tareaForm">
                <input type="text" id="tareaInput" placeholder="Escribe una tarea...">
                <button type="submit">Agregar tarea</button>
            </form>
        </section>

        <section class="contador">
            <h2>Progresion</h2>

            <p>Total de Tareas:<span id="totalTareas">0</span></p>

            <p>Completadas: <span id="tareasCompletadas">0</span></p>
            
            <p>Pendientes: <span id="tareasPendientes">0</span></p>
        
        </section>

        <section class="lista">
            <h2>Lista de actividades</h2>

            <ul id="listaTareas">
            </ul>
        </section>

    </main>
</body>
</html>
